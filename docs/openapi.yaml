openapi: 3.0.0
info:
  title: PostOp Guard API
  version: 1.0.0
  description: Post-Surgical Infection Risk Prediction API
servers:
  - url: http://localhost:3001/api

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                role: { type: string, enum: [patient, doctor, admin] }
      responses:
        201:
          description: Registration successful

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful

  /prediction:
    post:
      summary: Submit recovery check-in
      tags: [Prediction]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [painLevel, temperature, redness, swelling, discharge, daysSinceSurgery, activityLevel, smoking, diabetes]
      responses:
        201:
          description: Check-in created with prediction

  /prediction/history:
    get:
      summary: Get recovery history
      tags: [Prediction]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        200:
          description: Recovery records

  /prediction/trends:
    get:
      summary: Get trend data
      tags: [Prediction]
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer }
      responses:
        200:
          description: Trend data

  /analytics/dashboard:
    get:
      summary: Get user dashboard
      tags: [Analytics]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Dashboard data

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer